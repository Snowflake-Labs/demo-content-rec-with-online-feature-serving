[project]
name = "content-rec-backend"
version = "1.0.0"
description = "Real-time content recommendation API with Snowflake Online Feature Serving"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "snowflake-connector-python>=3.6.0",
    "snowflake-snowpark-python>=1.11.1",
    "snowflake-ml-python>=1.21.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "sqlfluff>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.uv]
# Override problematic transitive dependencies
override-dependencies = [
    "numba>=0.60.0",
    "llvmlite>=0.43.0",
]
